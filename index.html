  <link rel="icon" type="image/png" href="/varun.png">

  <link rel="stylesheet" href="/main site/styles.css">
  <style>
    #trail-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9997;
    }
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-top: 2rem;
    }
    .contact-card {
      background: rgba(10, 16, 29, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      color: #e2e8f0;
      text-decoration: none;
      transition: all 0.3s ease;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
    }
    .contact-card:hover {
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      transform: translateY(-3px);
    }
  </style>
</head>

</body>
